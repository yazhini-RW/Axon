[project]
name = "axon"
version = "0.1.0"
description = "A personal second brain that remembers your notes and acts on them."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
axon = "axon.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["axon*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: loads the 134MB embedding model; skip with -m 'not slow'",
]
